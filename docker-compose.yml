# ─── Orbit stack ────────────────────────────────────────────────────────────
# Self-hosted deployment: one app container + PostgreSQL 16.
#
#   cp .env.example .env   (fill in real values)
#   docker compose up -d
#
# Health endpoints on the app container:
#   GET /healthz   liveness
#   GET /readyz    readiness (checks database)
#   GET /metrics   Prometheus (gated by METRICS_GATED / admin token)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # consumed by docker/postgres-init/01-orbit-app-role.sh (first boot only)
      ORBIT_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
      # creates the NOSUPERUSER application role; the app NEVER connects as a
      # superuser because superusers bypass row level security entirely
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # bind to localhost only; expose only if you need external access
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-orbit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: orbit-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # the compose-internal hostname; this takes precedence over the .env
      # value and always connects as the NOSUPERUSER orbit role
      DATABASE_URL: postgresql://orbit:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-orbit}
      PORT: 3000
    ports:
      # bound locally only: public traffic arrives through the cloudflared
      # tunnel service (recommended) or your own reverse proxy
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Optional Cloudflare tunnel: gives the app a public HTTPS URL with zero
  # open inbound ports. Enable with:  docker compose --profile tunnel up -d
  #
  # 1. Zero Trust dashboard > Networks > Tunnels > Create a tunnel > cloudflared
  # 2. Copy the tunnel token into CLOUDFLARE_TUNNEL_TOKEN in .env
  # 3. Add a public hostname, e.g.  orbit.yourdomain.com -> http://app:3000
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # pgAdmin for database visualization. Local only (127.0.0.1:5050): never
  # expose it through the public tunnel. The Orbit server is pre-registered
  # connecting as the NOSUPERUSER orbit application role.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      # pgAdmin validates the login as a real-domain email: reserved names
      # (like *.local) crash it at boot; set PGADMIN_EMAIL in .env
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # pre-registered server: browser still shows tables without manual setup
      PGADMIN_SERVER_JSON: |
        {"Servers": {"1": {"Name": "Orbit (staging)", "Group": "Servers",
          "Host": "postgres", "Port": 5432, "MaintenanceDB": "${POSTGRES_DB:-orbit}",
          "Username": "orbit",
          "Password": "${POSTGRES_APP_PASSWORD}", "StorePassword": true,
          "SSLMode": "disable"}}}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  pgadmin_data:
